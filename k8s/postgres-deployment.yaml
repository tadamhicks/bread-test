apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: books
data:
  init.sql: |
    CREATE DATABASE bookdb;
    \c bookdb;
    CREATE TABLE IF NOT EXISTS books (
        id SERIAL PRIMARY KEY,
        title VARCHAR(255) NOT NULL,
        author VARCHAR(255) NOT NULL,
        summary BYTEA
    );
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: books
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: auto-ebs-sc
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: books
spec:
  replicas: 1
  # The EBS volume is ReadWriteOnce, so the old pod must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:18.6
        args:
        - -c
        - shared_preload_libraries=pg_stat_statements
        - -c
        - pg_stat_statements.track=all
        - -c
        - pg_stat_statements.max=10000
        - -c
        - track_io_timing=on
        ports:
        - containerPort: 5432
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
        readinessProbe:
          exec:
            # TCP, not the socket: the entrypoint's temporary init server listens on the socket only.
            command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "bookdb"]
          periodSeconds: 5
        volumeMounts:
        - name: postgres-init-script
          mountPath: /docker-entrypoint-initdb.d
        - name: postgres-data
          mountPath: /var/lib/postgresql
      volumes:
      - name: postgres-init-script
        configMap:
          name: postgres-init-script
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: books
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
