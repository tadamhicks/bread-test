apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookapi
  namespace: books
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookapi
  template:
    metadata:
      labels:
        app: bookapi
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:18.6
        command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
      containers:
      - name: bookapi
        image: tadamhicks/bookapi:4.0.2
        ports:
        - containerPort: 9292
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
          requests:
            cpu: "200m"
            memory: "512Mi"
        env:
        # Application configuration
        - name: PORT
          value: "9292"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
        - name: DATABASE_URL
          value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/bookdb?sslmode=disable"
        
        # OpenTelemetry configuration
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: groundcover-sensor.groundcover.svc.cluster.local:4318
        
        # OpenTelemetry service identification (required for groundcover)
        - name: OTEL_SERVICE_NAME
          value: "bookapi"
        - name: OTEL_SERVICE_VERSION
          value: "1.0.0"
        - name: OTEL_ENVIRONMENT
          value: "production"
        
        # Kubernetes metadata for OpenTelemetry resource attributes
        # These attributes are REQUIRED for traces to appear properly in groundcover
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CONTAINER_NAME
          value: "bookapi"  # No Downward API field available; known from spec
        # Option A: Direct value (current working approach)
        - name: CLUSTER_NAME
          value: "automode-cluster"
        # Option B: ConfigMap approach (requires cluster-info ConfigMap)
        # - name: CLUSTER_NAME
        #   valueFrom:
        #     configMapKeyRef:
        #       name: cluster-info
        #       key: cluster-name
---
apiVersion: v1
kind: Service
metadata:
  name: bookapi
  namespace: books
spec:
  selector:
    app: bookapi
  ports:
  - port: 80
    targetPort: 9292
  type: ClusterIP
