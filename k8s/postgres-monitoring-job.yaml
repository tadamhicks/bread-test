# Idempotent setup for groundcover PostgreSQL monitoring. Safe to rerun:
#   kubectl delete job -n books postgres-monitoring-setup --ignore-not-found
#   kubectl apply -f k8s/postgres-monitoring-job.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-monitoring-sql
  namespace: books
data:
  setup.sql: |
    SELECT 'CREATE ROLE groundcover LOGIN'
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'groundcover')
    \gexec
    ALTER ROLE groundcover WITH LOGIN PASSWORD :'gc_password';
    GRANT pg_monitor TO groundcover;
    \c bookdb
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    \c postgres
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-monitoring-setup
  namespace: books
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: setup
        image: postgres:18.6
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres -U postgres -d bookdb; do sleep 2; done
          psql -h postgres -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v gc_password="$GC_PASSWORD" -f /sql/setup.sql
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
        - name: GC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: groundcover-password
        volumeMounts:
        - name: sql
          mountPath: /sql
      volumes:
      - name: sql
        configMap:
          name: postgres-monitoring-sql
