# Lets the groundcover integrations agent resolve
# secretRef::k8s::groundcover::groundcover-postgresql::admin-password
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: integrations-agent-postgresql-secret
  namespace: groundcover
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["groundcover-postgresql"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: integrations-agent-postgresql-secret
  namespace: groundcover
subjects:
- kind: ServiceAccount
  name: integrations-agent
  namespace: groundcover
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: integrations-agent-postgresql-secret
